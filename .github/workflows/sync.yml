# Met à jour data/candidats.json toutes les 6 h ; l'app iOS lit ce fichier sur raw.githubusercontent.com.
name: sync
on:
  schedule: [{ cron: '17 */6 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test
      - run: npm run sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/candidats.json
          git diff --cached --quiet || git commit -m "sync: $(date -u +%FT%RZ)"
          git push
